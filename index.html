<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kala Senja — Dokumen Hukum</title>
<style>
  :root { --paper:#E9D5C0; --night:#22223B; --terracotta:#C97C5D; --dusk:#4A4E69; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--night); color:var(--paper);
         font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:3rem 1.25rem 5rem }
  h1 { font-size:1.8rem; margin:0 0 .25rem; letter-spacing:-.01em }
  p.sub { color:var(--dusk); filter:brightness(1.7); margin:0 0 2.5rem }
  ul { padding-left:0; list-style:none }
  li { margin:0 0 1rem }
  a.card { display:block; padding:1.1rem 1.25rem; border:1px solid rgba(233,213,192,.18);
           border-radius:10px; color:var(--paper); text-decoration:none; background:rgba(233,213,192,.03) }
  a.card:hover { border-color:var(--terracotta); background:rgba(201,124,93,.08) }
  a.card strong { display:block; font-size:1.05rem }
  a.card span { color:var(--dusk); filter:brightness(1.7); font-size:.92rem }
  footer { margin-top:3rem; padding-top:1.5rem; border-top:1px solid rgba(233,213,192,.14);
           color:var(--dusk); filter:brightness(1.6); font-size:.9rem }
  footer a { color:var(--terracotta) }
</style>
</head>
<body>
<main>
  <h1>Kala Senja</h1>
  <p class="sub">Dokumen hukum untuk alat internal Hilman Studio.</p>
  <ul>
    <li><a class="card" href="terms.html"><strong>Ketentuan Layanan</strong>
      <span>Terms of Service</span></a></li>
    <li><a class="card" href="privacy.html"><strong>Kebijakan Privasi</strong>
      <span>Privacy Policy</span></a></li>
  </ul>
  <footer>
    Kala Senja adalah proyek musik indie folk milik Hilman Anshori (Hilman Studio).<br>
    Kontak: <a href="mailto:kalasenjamusic@gmail.com">kalasenjamusic@gmail.com</a>
  </footer>
</main>
</body>
</html>
